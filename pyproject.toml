[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcanvil-kit"
dynamic = ["version"]
description = "Ready-made content for Anvil, the Minecraft Bedrock content development framework."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yasser A. Benfoughal" }]
requires-python = ">=3.15"
dependencies = [
    "mcanvil>=1.1.3",
    "click",
    "orjson",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.15",
]

[project.optional-dependencies]
ldtk = ["amulet-core"]
test = ["pytest", "jsonschema"]

[project.urls]
Github = "https://github.com/StarkTMA/anvil-kit"
Website = "https://anvil.starktma.net"

[tool.setuptools.dynamic]
version = { attr = "anvil_kit.__version__.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anvil_kit = [
    "blocks/wood_set/models/*",
]
